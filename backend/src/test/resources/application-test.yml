spring:
  datasource:
    url: jdbc:h2:mem:blood_center;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  sql:
    init:
      mode: never
  data:
    redis:
      host: 127.0.0.1
      port: 6379

logging:
  level:
    root: WARN
    com.blood.center: INFO
